<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hello from a Linux VM</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 Inter, "DejaVu Sans", sans-serif; color: #18181b; background: #fff; }
  header { padding: 48px 32px 24px; display: grid; justify-items: center; text-align: center; gap: 8px; }
  header img { width: 56px; height: 56px; }
  #clock { margin: 8px 0 0; font-size: 60px; font-weight: 600; letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums; }
  header p { margin: 0; color: #71717a; }
  main { padding: 8px 24px 48px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { padding: 14px 16px; border: 1px solid #e4e4e7; border-radius: 12px; }
  .card b { display: block; font-size: 18px; font-weight: 600; }
  .card span { color: #71717a; font-size: 13px; }
</style>
</head>
<body>
<header>
  <img src="../../web/icon.svg" alt="">
  <h1 id="clock">00:00:00</h1>
  <p>Hello from a Linux VM. Every pixel here is live.</p>
</header>
<main id="cards"></main>
<script>
  const clock = document.getElementById('clock');
  const tick = () => { clock.textContent = new Date().toTimeString().slice(0, 8); };
  tick();
  setInterval(tick, 250);

  const facts = [
    ['60 fps', 'smooth, every frame'],
    ['~20 ms', 'key press to pixel'],
    ['1 binary', 'no VNC, no X libs'],
    ['0.03%', 'CPU while idle'],
    ['Any proxy', 'one HTTPS port'],
    ['Phones too', 'touch and keyboard'],
  ];
  const cards = document.getElementById('cards');
  for (let i = 0; i < 4; i++) {
    for (const [k, v] of facts) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<b>${k}</b><span>${v}</span>`;
      cards.append(card);
    }
  }
</script>
</body>
</html>
