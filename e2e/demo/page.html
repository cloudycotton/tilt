<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hello from a Linux VM</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 Inter, "DejaVu Sans", sans-serif;
    color: #231b3d;
    background:
      radial-gradient(60% 40% at 15% 0%, #efe6ff 0%, transparent 70%),
      radial-gradient(50% 35% at 100% 10%, #ffe9dc 0%, transparent 70%),
      #fbfaff;
  }
  header { padding: 44px 32px 20px; display: grid; justify-items: center; text-align: center; gap: 6px; }
  header img { width: 64px; height: 64px; filter: drop-shadow(0 8px 16px rgba(69, 39, 160, 0.25)); }
  #clock { margin: 10px 0 0; font-size: 64px; font-weight: 600; letter-spacing: -2px; line-height: 1; font-variant-numeric: tabular-nums; }
  header p { margin: 0; color: #6b6488; font-size: 16px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 6px 12px;
    border-radius: 999px; background: #fff; box-shadow: 0 1px 0 rgba(35, 27, 61, 0.06), 0 4px 14px rgba(35, 27, 61, 0.06);
    font-size: 13px; font-weight: 500; color: #4b4366;
  }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 4px #dcfce7; }
  main { padding: 12px 24px 48px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    padding: 16px; border-radius: 16px; background: #fff;
    box-shadow: 0 1px 0 rgba(35, 27, 61, 0.05), 0 6px 20px rgba(35, 27, 61, 0.06);
  }
  .card b {
    display: block; font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
    background: linear-gradient(100deg, #ff8a4c, #ec5fb4 55%, #8b5cf6); -webkit-background-clip: text; color: transparent;
  }
  .card span { color: #6b6488; font-size: 13px; }
</style>
</head>
<body>
<header>
  <img src="../../web/icon.svg" alt="">
  <h1 id="clock">00:00:00</h1>
  <p>Hello from a Linux VM. Every pixel here is live.</p>
  <span class="pill"><i></i>Streaming with tilt</span>
</header>
<main id="cards"></main>
<script>
  const clock = document.getElementById('clock');
  const tick = () => { clock.textContent = new Date().toTimeString().slice(0, 8); };
  tick();
  setInterval(tick, 250);

  const facts = [
    ['60 fps', 'smooth, every frame'],
    ['~20 ms', 'key press to pixel'],
    ['1 binary', 'no VNC, no X libs'],
    ['0.03%', 'CPU while idle'],
    ['Any proxy', 'one HTTPS port'],
    ['Phones too', 'touch and keyboard'],
  ];
  const cards = document.getElementById('cards');
  for (let i = 0; i < 4; i++) {
    for (const [k, v] of facts) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<b>${k}</b><span>${v}</span>`;
      cards.append(card);
    }
  }
</script>
</body>
</html>
