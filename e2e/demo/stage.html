<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tilt demo</title>
<!-- The recording's frame: the tilt web client, unchanged, in an iframe set in a rounded screen.
     Open as stage.html#<tilt url, with its own #token=...>. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: grid;
    place-items: start center;
    padding-top: 44px;
    font: 500 17px/1 Inter, "DejaVu Sans", sans-serif;
    background:
      radial-gradient(55% 45% at 50% 0%, rgba(139, 92, 246, 0.22), transparent 70%),
      radial-gradient(40% 40% at 90% 100%, rgba(255, 138, 76, 0.14), transparent 70%),
      #0d0c12;
  }
  .screen {
    padding: 14px;
    border-radius: 34px;
    background: linear-gradient(160deg, #d6cff5 0%, #a9a1d6 45%, #8279b4 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.7),
      inset 0 -2px 6px rgba(40, 20, 90, 0.35),
      0 30px 80px rgba(0, 0, 0, 0.55);
  }
  iframe {
    display: block;
    width: 1280px;
    height: 800px;
    border: 0;
    border-radius: 21px;
    background: #000;
  }
  .chin {
    width: fit-content;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px 12px 12px;
    border-radius: 0 0 22px 22px;
    background: linear-gradient(180deg, #8a81bb, #7a71ab);
    color: #fff;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
  }
  .chin img { width: 30px; height: 30px; }
  .chin .live {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(30, 18, 70, 0.35);
    font-size: 15px;
  }
  .chin .live i { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 10px #4ade80; }
</style>
</head>
<body>
<div>
  <div class="screen"><iframe id="tilt" title="tilt" allow="fullscreen; clipboard-read; clipboard-write"></iframe></div>
  <div class="chin">
    <img src="../../web/icon.svg" alt="">
    <span>You have control</span>
    <span class="live"><i></i>Linux VM, live in Chrome</span>
  </div>
</div>
<script>
  document.getElementById('tilt').src = decodeURIComponent(location.hash.slice(1));
</script>
</body>
</html>
