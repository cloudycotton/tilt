<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tilt demo</title>
<!-- The recording's frame: the tilt web client, unchanged, in an iframe set in a rounded screen.
     Open as stage.html#<tilt url, with its own #token=...>. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: grid;
    place-items: start center;
    padding-top: 44px;
    font: 500 16px/1 Inter, "DejaVu Sans", sans-serif;
    background: #0b0c0e;
  }
  .screen {
    padding: 14px;
    border-radius: 34px;
    background: linear-gradient(180deg, #3a3b40, #26272b);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 30px 80px rgba(0, 0, 0, 0.6);
  }
  iframe {
    display: block;
    width: 1280px;
    height: 800px;
    border: 0;
    border-radius: 21px;
    background: #000;
  }
  .chin {
    width: fit-content;
    margin: 0 auto;
    padding: 12px 22px 14px;
    border-radius: 0 0 18px 18px;
    background: #26272b;
    color: #e4e4e7;
  }
</style>
</head>
<body>
<div>
  <div class="screen"><iframe id="tilt" title="tilt" allow="fullscreen; clipboard-read; clipboard-write"></iframe></div>
  <div class="chin">You have control</div>
</div>
<script>
  document.getElementById('tilt').src = decodeURIComponent(location.hash.slice(1));
</script>
</body>
</html>
