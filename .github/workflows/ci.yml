name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # nasm for OpenH264's assembly; the rest is the headless display the X tests drive.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nasm xvfb x11-utils \
            x11-xserver-utils x11-xkb-utils xdotool xterm
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked -- --include-ignored

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Launcher and installer
        run: node --test npm/test/launcher.test.mjs
      - name: Web client against the mock server
        working-directory: e2e/mock
        run: |
          npm ci
          npx playwright install --with-deps chrome webkit
          npx playwright test
