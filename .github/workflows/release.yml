name: Release

# Every push to main whose Cargo.toml version has no tag yet becomes a release: static binaries
# for x86_64 and arm64 on GitHub, which every installed tilt picks up the next time it starts
# (src/update.rs). The tilt-live npm package follows
# for any version npm does not have yet, so a failed or skipped publish is made up on the next
# run (Actions > Release > Run workflow). npm uses trusted publishing configured for
# cloudycotton/tilt and release.yml in tilt-live's npm package settings.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$(node -p "require('./npm/package.json').version")" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$(npm view "tilt-live@$version" version 2>/dev/null)" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tilt-live $version is already on npm"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  github:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Only to run the arm64 binary below; tilt itself is cross-compiled.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Static binaries (cross-compiled with zig, no emulation)
        run: scripts/build-static.sh amd64 arm64
      - name: Verify both release binaries start
        # arm64 runs through the QEMU binfmt handler that docker/setup-qemu-action registered.
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TILT_NO_UPDATE: 1
        run: |
          test "$(dist/tilt-x86_64-unknown-linux-musl --version)" = "tilt $VERSION"
          test "$(dist/tilt-aarch64-unknown-linux-musl --version)" = "tilt $VERSION"
          dist/tilt-x86_64-unknown-linux-musl --help
          dist/tilt-aarch64-unknown-linux-musl --help
      - name: Release v${{ needs.version.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd dist && sha256sum tilt-* > SHA256SUMS && cat SHA256SUMS)
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "tilt $VERSION" --generate-notes

  npm:
    needs: [version, github]
    # Also when the GitHub release was made by an earlier run (github skipped).
    if: >-
      always() && needs.version.outputs.publish == 'true' &&
      (needs.github.result == 'success' || needs.github.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify release assets are available
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TILT_NO_UPDATE: 1
        run: |
          mkdir -p dist
          gh release download "v$VERSION" --dir dist
          (cd dist && sha256sum -c SHA256SUMS)
          # Release downloads carry no mode bits.
          chmod +x dist/tilt-x86_64-unknown-linux-musl
          test "$(dist/tilt-x86_64-unknown-linux-musl --version)" = "tilt $VERSION"
      - name: Test launchers
        run: node --test npm/test/launcher.test.mjs
      - name: Publish tilt-live ${{ needs.version.outputs.version }}
        working-directory: npm
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm install -g npm@11.12.1
          cp ../LICENSE .
          npm publish --provenance --access public
      - name: Verify installation from npm
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          smoke=$(mktemp -d)
          npm install --prefix "$smoke" --ignore-scripts "tilt-live@$VERSION"
          test "$("$smoke/node_modules/.bin/tilt-live" --version)" = "tilt $VERSION"
          "$smoke/node_modules/.bin/tilt-live" --help
