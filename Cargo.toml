[workspace]
members = [".", "tools/e2e"]
resolver = "2"

[package]
name = "tilt"
version = "0.1.0"
edition = "2021"
description = "Stream a Linux X11 desktop to a browser over WebSocket + WebCodecs H.264, with remote control"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
bytes = "1"
socket2 = { version = "0.6", features = ["all"] }
crossbeam-channel = "0.5"
x11rb = { version = "0.14", features = ["shm", "damage", "xfixes", "xtest", "randr"] }
openh264-sys2 = "0.9.8"
yuv = "0.8.19"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mimalloc = { version = "0.1", default-features = false }
libc = "0.2"
getrandom = "0.3"
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
