[workspace]
members = [".", "tools/e2e"]
resolver = "2"

[package]
name = "tilt"
version = "0.6.2"
edition = "2021"
description = "Stream a Linux X11 desktop to a browser over WebSocket + WebCodecs H.264, with remote control"
license = "MIT"
repository = "https://github.com/cloudycotton/tilt"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
bytes = "1"
crossbeam-channel = "0.5"
x11rb = { version = "0.14", features = ["shm", "damage", "xfixes", "xtest", "randr", "xinput"] }
openh264-sys2 = "0.9.8"
yuv = "0.8.19"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mimalloc = { version = "0.1", default-features = false }
libc = "0.2"
getrandom = "0.3"
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
wtransport = { version = "0.7.2", default-features = false, features = ["ring", "self-signed", "quinn"] }
time = { version = "0.3", default-features = false }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
ring = { version = "0.17", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
