[package]
name = "tilt-e2e"
version = "0.1.0"
edition = "2021"
description = "End-to-end helpers for tilt: a WebTransport probe client and an X11 test pattern"
publish = false

[[bin]]
name = "tilt-probe"
path = "src/bin/tilt-probe.rs"

[[bin]]
name = "tilt-testpattern"
path = "src/bin/tilt-testpattern.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
# As in tilt itself, so the workspace builds one copy.
wtransport = { version = "0.7.2", default-features = false, features = ["ring", "self-signed", "quinn"] }
openh264 = "0.9.8"
x11rb = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
