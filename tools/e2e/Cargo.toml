[package]
name = "tilt-e2e"
version = "0.1.0"
edition = "2021"
description = "End-to-end helpers for tilt: a WebSocket probe client and an X11 test pattern"
publish = false

[[bin]]
name = "tilt-probe"
path = "src/bin/tilt-probe.rs"

[[bin]]
name = "tilt-testpattern"
path = "src/bin/tilt-testpattern.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
# Must match the tokio-tungstenite that axum 0.8.9 uses, so the workspace builds one copy.
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
openh264 = "0.9.8"
x11rb = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
