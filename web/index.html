<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  // Behind a gateway that serves tilt under a path (https://host/desk/), the page must be opened
  // as a directory: from https://host/desk, app.js and the stream would resolve to the host root.
  // (Not a page loaded as a file, such as an app's WebView opening its own index.html.)
  if (/^https?:$/.test(location.protocol) && !/(\/|\.html?)$/.test(location.pathname)) {
    location.replace(location.pathname + '/' + location.search + location.hash);
  }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script>
  // Before the first paint: #bg=<css colour> sets what shows around the screen and before the
  // first frame. Transparent by default, so a host page's own background shows through.
  (function () {
    var m = /(?:^|&)bg=([^&]*)/.exec(location.hash.slice(1));
    if (!m) return;
    var bg = decodeURIComponent(m[1]);
    if (/^[0-9a-f]{3,8}$/i.test(bg)) bg = '#' + bg;
    document.documentElement.style.setProperty('--bg', bg);
  })();
</script>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- app.js imports these: fetching them now saves two round trips per load. -->
<link rel="modulepreload" href="input.js">
<link rel="modulepreload" href="keysyms.js">
<title>tilt</title>
<style>
  /* Headless: the remote screen and nothing else. The host page draws every control and talks
     to this one through postMessage (docs/guide.md, "Embedding"). */
  :root {
    --bg: transparent;
    --kb: 0px;
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
  }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg);
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  /* Fixed so iOS never scrolls the page when the soft keyboard opens. */
  body { position: fixed; inset: 0; }
  /* The remote screen stops above the on-screen keyboard (CSS --kb). */
  #viewport {
    position: fixed;
    top: var(--sat);
    right: var(--sar);
    bottom: max(var(--sab), var(--kb));
    left: var(--sal);
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  /* Desktop 1:1 mode scrolls natively; the stage centres while it is smaller than the viewport. */
  #viewport.scroll { overflow: auto; display: grid; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #viewport.scroll #stage { position: relative; margin: auto; }
  #screen { display: block; width: 100%; height: 100%; }
  #cursor {
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: none;
    transform-origin: 0 0;
    image-rendering: pixelated;
  }
  /* The hidden keyboard field: 16px keeps iOS from zooming when it gains focus. */
  #kbd {
    position: fixed;
    left: 0;
    top: 0;
    width: 1px;
    height: 1px;
    padding: 0;
    border: 0;
    opacity: 0;
    font-size: 16px;
    resize: none;
    overflow: hidden;
    white-space: pre;
    color: transparent;
    background: transparent;
    caret-color: transparent;
  }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <canvas id="screen" width="0" height="0" aria-label="Remote desktop"></canvas>
    <img id="cursor" alt="" draggable="false" hidden>
  </div>
</div>
<textarea id="kbd" aria-label="Remote keyboard input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="enter" tabindex="-1"></textarea>
<script type="module" src="app.js"></script>
</body>
</html>
