<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#4527a0"/>
      <stop offset=".55" stop-color="#26166b"/>
      <stop offset="1" stop-color="#120a35"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".4" r=".55">
      <stop offset="0" stop-color="#ff86c8" stop-opacity=".5"/>
      <stop offset=".6" stop-color="#8b5cf6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".3" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1=".9" y1="0" x2=".1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset=".42" stop-color="#ff7d6e"/>
      <stop offset=".75" stop-color="#ec5fb4"/>
      <stop offset="1" stop-color="#a75bff"/>
    </linearGradient>
    <radialGradient id="depth" cx=".35" cy=".25" r=".95">
      <stop offset=".55" stop-color="#3a0f6e" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a0f6e" stop-opacity=".45"/>
    </radialGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b65cff"/>
      <stop offset="1" stop-color="#7342f5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#08021f" flood-opacity=".6"/>
