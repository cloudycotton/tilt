    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2a0a5e" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect width="256" height="256" rx="58" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <g filter="url(#shadow)">
    <path d="M140 170q-4 16-12 28" stroke="url(#neck)" stroke-width="18" stroke-linecap="round" fill="none"/>
    <rect x="92" y="192" width="72" height="18" rx="9" fill="url(#neck)"/>
    <g transform="rotate(-13 128 116)">
