      <ellipse cx="103" cy="116" rx="13" ry="17" fill="#1b0b44"/>
      <ellipse cx="153" cy="116" rx="13" ry="17" fill="#1b0b44"/>
      <circle cx="107.5" cy="108.5" r="5" fill="#fff"/>
      <circle cx="157.5" cy="108.5" r="5" fill="#fff"/>
      <circle cx="99" cy="124" r="2.2" fill="#fff" opacity=".7"/>
      <circle cx="149" cy="124" r="2.2" fill="#fff" opacity=".7"/>
      <path d="M117 145q11 10 22 0" stroke="#1b0b44" stroke-width="6.5" stroke-linecap="round" fill="none"/>
      <ellipse cx="79" cy="139" rx="11" ry="6.5" fill="#ff3d8b" opacity=".4"/>
      <ellipse cx="177" cy="139" rx="11" ry="6.5" fill="#ff3d8b" opacity=".4"/>
